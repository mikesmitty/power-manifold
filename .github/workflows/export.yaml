on:
  push:
    branches:
      - main
    paths:
      - '**.kicad_pcb'
      - '**/cad.kibot.yaml'
  workflow_dispatch:
    inputs:
      module:
        description: "Module to export"
        type: choice
        default: all
        options:
          - all
          - backplane
          - charger-module
          - controller
          - pcie-breakout

name: KiCad Export

jobs:
  get-changed-files:
    name: Get changed files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        if: github.event_name == 'push'
        uses: tj-actions/changed-files@v47
        with:
          files: |
            hardware/*/*.kicad_pcb
            hardware/*/cad.kibot.yaml
          matrix: true

      - name: Resolve boards to export
        id: boards
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODULE: ${{ inputs.module }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          set -euo pipefail

          # Collect the module directories to rebuild, either from the dispatch
          # input or from whatever the push touched (a board or its CAD config).
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$MODULE" = "all" ]; then
              DIRS="$(git ls-files 'hardware/*/*.kicad_pcb' | xargs -r -n1 dirname)"
            else
              DIRS="hardware/${MODULE}"
            fi
          else
            DIRS="$(printf '%s' "$CHANGED_FILES" | jq -r '.[]' | xargs -r -n1 dirname)"
          fi

          # Every directory maps back to its board file, deduplicated
          FILES="$(
            printf '%s\n' $DIRS | sort -u | while read -r dir; do
              if [ -n "$dir" ]; then
                git ls-files "$dir/*.kicad_pcb"
              fi
            done | sort -u | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))'
          )"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

          if [ "$FILES" = "[]" ]; then
            echo "any-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "any-changed=true" >> "$GITHUB_OUTPUT"
          fi

    outputs:
      any-changed: ${{ steps.boards.outputs.any-changed }}
      matrix: ${{ steps.boards.outputs.files }}

  export-cad:
    if: ${{ fromJson(needs.get-changed-files.outputs.any-changed) }}
    needs: get-changed-files

    name: Render PCB
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto:1.9.1

    strategy:
      matrix:
        files: ${{ fromJSON(needs.get-changed-files.outputs.matrix) }}
      max-parallel: 4
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Get output directories
        id: get-paths
        run: |
          # Get the directory of the PCB file
          KICAD_DIR="$(dirname "${{ matrix.files }}")"
          echo "kicad-dir=$KICAD_DIR" >> "$GITHUB_OUTPUT"

          # Get the name of the hardware module
          MODULE_NAME="$(basename "$KICAD_DIR")"
          echo "module-name=$MODULE_NAME" >> "$GITHUB_OUTPUT"

          # Get the parent project directory
          PROJECT_DIR="$(dirname "${KICAD_DIR}")"
          echo "project-dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # Keyed per module on the board file, since the footprints on the board
      # decide which 3D models get downloaded. A board edit misses the exact key
      # and falls back to that module's last cache, so KiBot only fetches what
      # actually changed.
      - name: Cache 3D models
        id: models-cache
        uses: actions/cache@v6
        with:
          path: ~/cache_3d
          key: cache-3d-${{ steps.get-paths.outputs.module-name }}-${{ hashFiles(matrix.files) }}
          restore-keys: |
            cache-3d-${{ steps.get-paths.outputs.module-name }}-

      - name: Run KiBot
        uses: INTI-CMNB/KiBot@v2_k10
        with:
          board: ${{ matrix.files }}
          config: ./${{ steps.get-paths.outputs.kicad-dir }}/cad.kibot.yaml
          dir: ${{ steps.get-paths.outputs.project-dir }}/CAD/
          cache3D: YES
          verbose: 4

      - name: Clean up log files
        run: |
          rm -fv ${{ steps.get-paths.outputs.project-dir }}/CAD/*.log

      - name: Store exported CAD files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.get-paths.outputs.module-name }}
          path: "${{ steps.get-paths.outputs.project-dir }}/CAD/${{ steps.get-paths.outputs.module-name }}.step"
          overwrite: true

  push-changes:
    needs: export-cad

    name: Render PCB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: hardware/CAD/

      - name: Commit changes
        uses: EndBug/add-and-commit@v11
        with:
          add: hardware/CAD/
          default_author: github_actor
          message: "chore: KiBot CAD update"
          pull: '--rebase --autostash'
