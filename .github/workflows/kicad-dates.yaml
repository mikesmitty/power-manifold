on:
  push:
    branches:
      - main
    paths:
      - '**.kicad_sch'
      - '**.kicad_pcb'


name: KiCad Date Update

jobs:
  get-changed-files:
    name: Get changed files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed PCB files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **/*.kicad_pcb
            **/*.kicad_sch
          json: true

    outputs:
      any-changed: ${{ steps.changed-files.outputs.any_changed }}
      files: ${{ steps.changed-files.outputs.all_changed_files }}

  update:
    if: ${{ fromJson(needs.get-changed-files.outputs.any-changed) }}
    needs: get-changed-files

    name: Update KiCad dates
    runs-on: ubuntu-latest

    # Stamp every changed file in one job and one commit. Fanning this out over
    # a matrix raced: each job pushed to main from the same base, so the first
    # push won and the rest were rejected as stale.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Update KiCad file dates
        env:
          FILES: ${{ needs.get-changed-files.outputs.files }}
        run: |
          TODAY="$(date +%F)"
          jq -r '.[]' <<< "$FILES" | while IFS= read -r file; do
            [ -f "$file" ] || continue
            sed -i "s/(date \".*\"/(date \"$TODAY\"/" "$file"
          done

      - name: Commit changes
        uses: EndBug/add-and-commit@v11
        with:
          default_author: github_actor
          message: "chore: update KiCad dates"
          pull: '--rebase --autostash'
