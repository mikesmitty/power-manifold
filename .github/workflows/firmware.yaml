on:
  push:
    branches:
      - main
    paths:
      - 'firmware/controller/**'
      - 'firmware/charger-module/**' # its image rides inside the controller's
      - '.github/workflows/firmware.yaml'
  pull_request:
    paths:
      - 'firmware/controller/**'
      - 'firmware/charger-module/**'
      - '.github/workflows/firmware.yaml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        type: string
        required: false
        default: ''

name: Firmware Build

permissions:
  contents: read

env:
  PICO_SDK_VERSION: 2.2.0

jobs:
  host-tests:
    name: Engine host tests
    # Skipped where the same code is built anyway: on a release PR's branch
    # (main already built it; only the version differs), and on the push of
    # this component's release commit, which Release Please builds itself at
    # the tag (that call sets inputs.ref).
    if: >-
      !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')) &&
      !(github.event_name == 'push' && !inputs.ref &&
        startsWith(github.event.head_commit.message, 'chore(main): release controller-firmware'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Configure
        run: cmake -S firmware/controller/test -B firmware/controller/test/build

      - name: Build
        run: cmake --build firmware/controller/test/build

      - name: Run
        run: ctest --test-dir firmware/controller/test/build --output-on-failure

  build:
    name: Build controller firmware
    if: >- # as for host-tests
      !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')) &&
      !(github.event_name == 'push' && !inputs.ref &&
        startsWith(github.event.head_commit.message, 'chore(main): release controller-firmware'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Cache pico-sdk
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: ~/pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-v3

      - name: Fetch pico-sdk
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PICO_SDK_VERSION" \
            https://github.com/raspberrypi/pico-sdk "$HOME/pico-sdk"
          # only the submodules this firmware links against
          git -C "$HOME/pico-sdk" submodule update --init --depth 1 \
            lib/cyw43-driver lib/lwip lib/mbedtls lib/tinyusb lib/btstack

      # The gen-3 blade firmware first: the controller carries its image and
      # programs blades with it (firmware/controller/docs/flash-and-updates.md, "Blade
      # firmware updates"). Same cross toolchain; CMSIS and ST's USB-PD stack
      # are fetched by its CMake at pinned tags.
      - name: Build blade firmware
        run: |
          cmake -S firmware/charger-module -B firmware/charger-module/build -G Ninja
          ninja -C firmware/charger-module/build

      # The production controller card: the default board.
      - name: Configure
        run: >
          cmake -S firmware/controller -B firmware/controller/build -G Ninja
          -DPICO_SDK_PATH="$HOME/pico-sdk"
          -DBLADE_IMAGE="$GITHUB_WORKSPACE/firmware/charger-module/build/charger-module.bin"

      - name: Build
        run: ninja -C firmware/controller/build

      - name: Store firmware
        uses: actions/upload-artifact@v7
        with:
          name: controller-firmware
          path: |
            firmware/controller/build/controller.uf2
            firmware/controller/build/controller.bin
            firmware/controller/build/controller.elf
            firmware/controller/build/controller-factory.bin
            firmware/controller/build/partition_table.uf2

      # The Pico 2 W on the pcie-breakout: a development stand-in until the
      # card exists. Built and released so a bench board can be updated; it
      # goes away with the breakout.
      - name: Configure (Pico 2 W)
        run: >
          cmake -S firmware/controller -B firmware/controller/build-pico2w -G Ninja
          -DPICO_BOARD=pico2_w -DPICO_SDK_PATH="$HOME/pico-sdk"
          -DBLADE_IMAGE="$GITHUB_WORKSPACE/firmware/charger-module/build/charger-module.bin"

      - name: Build (Pico 2 W)
        run: ninja -C firmware/controller/build-pico2w

      - name: Store Pico 2 W firmware
        uses: actions/upload-artifact@v7
        with:
          name: controller-pico2w-firmware
          path: |
            firmware/controller/build-pico2w/controller.uf2
            firmware/controller/build-pico2w/controller.bin
            firmware/controller/build-pico2w/controller.elf
            firmware/controller/build-pico2w/controller-factory.bin
            firmware/controller/build-pico2w/partition_table.uf2
