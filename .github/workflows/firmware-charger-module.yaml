on:
  push:
    branches:
      - main
    paths:
      - 'firmware/charger-module/**'
      - 'firmware/tools/**'
      - '.github/workflows/firmware-charger-module.yaml'
  pull_request:
    paths:
      - 'firmware/charger-module/**'
      - 'firmware/tools/**'
      - '.github/workflows/firmware-charger-module.yaml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        type: string
        required: false
        default: ''

name: Charger Module Firmware Build

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests
    # Skipped where the same code is built anyway: on a release PR's branch
    # (main already built it; only the version differs), and on the push of
    # this component's release commit, which Release Please builds itself at
    # the tag (that call sets inputs.ref).
    if: >-
      !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')) &&
      !(github.event_name == 'push' && !inputs.ref &&
        startsWith(github.event.head_commit.message, 'chore(main): release charger-module-firmware'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Configure
        run: cmake -S firmware/charger-module/test -B firmware/charger-module/test/build

      - name: Build
        run: cmake --build firmware/charger-module/test/build

      - name: Run
        run: ctest --test-dir firmware/charger-module/test/build --output-on-failure

  build:
    name: Build charger module firmware
    if: >- # as for host-tests
      !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')) &&
      !(github.event_name == 'push' && !inputs.ref &&
        startsWith(github.event.head_commit.message, 'chore(main): release charger-module-firmware'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      # CMSIS headers and ST's USB-PD stack are fetched by CMake at pinned tags
      - name: Configure
        run: cmake -S firmware/charger-module -B firmware/charger-module/build -G Ninja

      - name: Build
        run: ninja -C firmware/charger-module/build

      - name: Software bill of materials
        run: >
          python3 firmware/tools/sbom.py charger-module
          --out firmware/charger-module/build/charger-module.cdx.json

      - name: Store firmware
        uses: actions/upload-artifact@v7
        with:
          name: charger-module-firmware
          path: |
            firmware/charger-module/build/charger-module.elf
            firmware/charger-module/build/charger-module.bin
            firmware/charger-module/build/charger-module.hex
            firmware/charger-module/build/charger-module.cdx.json
