on:
  push:
    branches:
      - main

name: Release Please

# Serialize runs: an overlapping run commits stale manifest contents on top of
# the newer HEAD (see the duplicate backplane 0.13.0 PRs #158/#160).
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    outputs:
      controller-released: ${{ steps.release-please.outputs['firmware/controller--release_created'] }}
      controller-tag: ${{ steps.release-please.outputs['firmware/controller--tag_name'] }}
      charger-module-released: ${{ steps.release-please.outputs['firmware/charger-module--release_created'] }}
      charger-module-tag: ${{ steps.release-please.outputs['firmware/charger-module--tag_name'] }}

  build-controller-firmware:
    name: Build controller firmware
    needs: release-please
    if: needs.release-please.outputs.controller-released == 'true'
    uses: ./.github/workflows/firmware.yaml
    with:
      ref: ${{ needs.release-please.outputs.controller-tag }}

  attach-controller-firmware:
    name: Attach firmware to release
    needs:
      - release-please
      - build-controller-firmware
    runs-on: ubuntu-latest
    # Holds the signing variables; its protection rules decide who may
    # release a signed image (firmware/controller/keys/README.md).
    environment: firmware-signing
    permissions:
      contents: write
      id-token: write # Workload Identity Federation, for Cloud KMS
    env:
      KMS_KEY: ${{ vars.UPDATE_SIGNING_KMS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.controller-tag }}

      # The release is the controller card's build. The Pico 2 W build (a
      # development stand-in on the pcie-breakout) rides along under -pico2w
      # names.
      - uses: actions/download-artifact@v8
        with:
          name: controller-firmware
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: controller-pico2w-firmware
          path: pico2w

      - name: Name the Pico 2 W's files
        run: |
          mv pico2w/controller.uf2 dist/controller-pico2w.uf2
          mv pico2w/controller.bin dist/controller-pico2w.bin
          mv pico2w/controller.elf dist/controller-pico2w.elf
          mv pico2w/controller-factory.bin dist/controller-pico2w-factory.bin
          mv pico2w/partition_table.uf2 dist/partition_table-pico2w.uf2

      # controller*.signed.bin is what a controller installs over the network:
      # the raw image plus an Ed25519 signature made by Cloud KMS, which names
      # the board the image is for. The private key never leaves KMS; this job
      # only asks it to sign 112 bytes per image.
      # Direct Workload Identity Federation, no service account: the key's
      # signer role is granted to jobs of this repository that run in the
      # firmware-signing environment, and to nothing else.
      - name: Authenticate to Google Cloud
        if: env.KMS_KEY != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up gcloud
        if: env.KMS_KEY != ''
        uses: google-github-actions/setup-gcloud@v3

      - name: Sign the images
        if: env.KMS_KEY != ''
        run: |
          sign() { python3 firmware/controller/tools/sign_image.py sign "$1" --board "$2" --kms-key "$KMS_KEY"; }
          sign dist/controller.bin pwrman_controller_card
          sign dist/controller-pico2w.bin pico2_w

      # The firmware's own check, with the public keys this release is built
      # with: a signature those keys do not accept must not be published.
      - name: Verify the signed images
        if: env.KMS_KEY != ''
        run: |
          cmake -S firmware/controller/test -B verify-build
          cmake --build verify-build --target verify_image
          verify-build/verify_image dist/controller.signed.bin pwrman_controller_card
          verify-build/verify_image dist/controller-pico2w.signed.bin pico2_w

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.controller-tag }}
        run: |
          assets=(
            dist/controller.uf2 dist/controller.elf dist/partition_table.uf2
            dist/controller-factory.bin
            dist/controller-pico2w.uf2 dist/controller-pico2w.elf dist/partition_table-pico2w.uf2
            dist/controller-pico2w-factory.bin
          )
          if [ -f dist/controller.signed.bin ]; then
            assets+=(dist/controller.signed.bin dist/controller-pico2w.signed.bin)
          else
            echo "::warning::UPDATE_SIGNING_KMS_KEY is not set: this release has no signed images"
          fi
          gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  build-charger-module-firmware:
    name: Build charger module firmware
    needs: release-please
    if: needs.release-please.outputs.charger-module-released == 'true'
    uses: ./.github/workflows/firmware-charger-module.yaml
    with:
      ref: ${{ needs.release-please.outputs.charger-module-tag }}

  attach-charger-module-firmware:
    name: Attach charger module firmware to release
    needs:
      - release-please
      - build-charger-module-firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: charger-module-firmware
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.charger-module-tag }}
        run: |
          gh release upload "$TAG" dist/charger-module.elf dist/charger-module.bin \
            dist/charger-module.hex \
            --repo "$GITHUB_REPOSITORY" --clobber
